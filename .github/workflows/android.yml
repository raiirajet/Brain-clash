name: Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - run: bash scripts/bootstrap_android.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify and prepare APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/BrainClash-v0.2.0-TEST.apk
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$SDK_TOOLS" verify --verbose --print-certs output/BrainClash-v0.2.0-TEST.apk
          "$(dirname "$SDK_TOOLS")/aapt" dump badging output/BrainClash-v0.2.0-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrainClash-v0.2.0-TEST
          path: output/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-scaffold-and-lockfile
          path: |
            android/
            pubspec.lock
