name: Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            pubspec.yaml
            scripts/bootstrap_android.sh
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - run: bash scripts/bootstrap_android.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: bash scripts/retry_dependency_build.sh flutter build apk --release
      - name: Version metadata
        id: version
        run: |
          echo "name=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - name: Verify and prepare APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/BrainClash-v${{ steps.version.outputs.name }}-TEST.apk
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$SDK_TOOLS" verify --verbose --print-certs output/BrainClash-v${{ steps.version.outputs.name }}-TEST.apk
          "$(dirname "$SDK_TOOLS")/aapt" dump badging output/BrainClash-v${{ steps.version.outputs.name }}-TEST.apk
          (cd output && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: BrainClash-v${{ steps.version.outputs.name }}-TEST
          path: output/
      - name: Publish verified test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}-test-${GITHUB_SHA:0:7}"
          gh release create "$TAG" output/*.apk --target "$GITHUB_SHA" --prerelease --title "Brain Clash ${{ steps.version.outputs.name }} TEST" --notes "Optimized test APK signed with a non-production key. If Android reports a signature conflict, preserve existing data and use a separate test device; do not uninstall blindly. Not a final production release."
      - uses: actions/upload-artifact@v4
        with:
          name: Android-scaffold-and-lockfile
          path: |
            android/
            pubspec.lock
      - name: Save generated Android scaffold and lockfile to source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save generated Android scaffold and dependency lock [skip ci]'
          git push origin HEAD:main
