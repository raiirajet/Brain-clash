name: Signed Android Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  device:
    uses: ./.github/workflows/device.yml
  release:
    needs: device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - name: Require matching version
        run: |
          VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: bash scripts/bootstrap_android.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Configure durable release signature
        env:
          BRAINCLASH_KEYSTORE_B64: ${{ secrets.BRAINCLASH_KEYSTORE_B64 }}
          BRAINCLASH_STORE_PASSWORD: ${{ secrets.BRAINCLASH_STORE_PASSWORD }}
          BRAINCLASH_KEY_ALIAS: ${{ secrets.BRAINCLASH_KEY_ALIAS }}
          BRAINCLASH_KEY_PASSWORD: ${{ secrets.BRAINCLASH_KEY_PASSWORD }}
        run: |
          test -n "$BRAINCLASH_KEYSTORE_B64"
          umask 077
          export BRAINCLASH_KEYSTORE="$RUNNER_TEMP/brainclash.jks"
          printf '%s' "$BRAINCLASH_KEYSTORE_B64" | base64 -d > "$BRAINCLASH_KEYSTORE"
          python3 scripts/configure_release.py
          flutter build apk --release
      - name: Verify APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk "output/BrainClash-$GITHUB_REF_NAME.apk"
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$SDK_TOOLS" verify --verbose --print-certs output/*.apk
          "$(dirname "$SDK_TOOLS")/aapt" dump badging output/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrainClash-signed
          path: output/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" output/*.apk --verify-tag --generate-notes
      - name: Remove transient key
        if: always()
        run: rm -f "$RUNNER_TEMP/brainclash.jks"
