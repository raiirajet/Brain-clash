name: Quiz Clash Android
on:
  push:
    branches: [feature/quiz-clash]
    paths:
      - 'quiz-clash/**'
      - '.github/workflows/quiz-clash-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Profile model tests
        run: |
          mkdir -p /tmp/quiz-profile-tests
          javac -d /tmp/quiz-profile-tests quiz-clash/app/src/main/java/ch/quizclash/mobile/ProfileModel.java quiz-clash/tests/ProfileModelTest.java
          java -cp /tmp/quiz-profile-tests ch.quizclash.mobile.ProfileModelTest
      - name: Validate embedded questions
        run: python3 quiz-clash/scripts/validate_bank.py quiz-clash/app/src/main/assets/bank
      - name: Build and lint
        working-directory: quiz-clash
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK
        run: |
          mkdir -p dist
          cp quiz-clash/app/build/outputs/apk/debug/app-debug.apk dist/Quiz-Clash-0.1.4-debug.apk
          python3 quiz-clash/scripts/validate_bank.py quiz-clash/app/src/main/assets/bank dist/Quiz-Clash-0.1.4-debug.apk dist/Quiz-Clash-5400-Fragen.json
          cd dist
          sha256sum Quiz-Clash-0.1.4-debug.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Quiz-Clash-0.1.4-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Quiz-Clash-0.1.4-APK
          path: dist/
          if-no-files-found: error
