name: Store assets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/store_assets.py'
      - 'integration_test/store_capture_test.dart'
      - 'test_driver/**'
      - '.github/workflows/store.yml'
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - run: bash scripts/bootstrap_android.sh
      - run: flutter pub get
      - run: python3 -m pip install Pillow==11.3.0
      - run: python3 scripts/store_assets.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/capture_store.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BrainClash-store-assets
          path: output/store/
